<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Supplier Product Exporter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Supplier Export</h1>
        <p>Copy Camden, Frames Direct, or Palladio products and prices as import-ready JSON.</p>
      </div>
    </header>

    <button id="parseButton" class="primary" type="button">Parse current quotation</button>

    <section id="resultSection" class="hidden" aria-live="polite">
      <dl class="summary">
        <div><dt>Supplier</dt><dd id="supplierName">-</dd></div>
        <div><dt>Order</dt><dd id="orderReference">-</dd></div>
        <div><dt>Products</dt><dd id="productCount">0</dd></div>
        <div><dt>Total</dt><dd id="totalPrice">€0.00</dd></div>
      </dl>

      <p id="warning" class="warning hidden"></p>

      <div class="actions">
        <button id="copyButton" class="primary" type="button">Copy JSON</button>
        <button id="downloadButton" type="button">Download JSON</button>
      </div>

      <details>
        <summary>Preview</summary>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Ref</th>
                <th>Product</th>
                <th>Size</th>
                <th>Qty</th>
                <th>Unit price</th>
              </tr>
            </thead>
            <tbody id="previewBody"></tbody>
          </table>
        </div>
      </details>
    </section>

    <p id="status" class="status" role="status"></p>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
